<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Rust Hello World program running in a terminal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 20px; fill: #c9d1d9; }
    .l { opacity: 0; animation: in .5s ease-out forwards; }
    .d1 { animation-delay: .3s; }
    .d2 { animation-delay: .9s; }
    .d3 { animation-delay: 1.5s; }
    .d4 { animation-delay: 2.3s; }
    .d5 { animation-delay: 3.1s; }
    .d6 { animation-delay: 3.6s; }
    .kw { fill: #ff7b72; }
    .fn { fill: #d2a8ff; }
    .mac { fill: #79c0ff; }
    .str { fill: #a5d6ff; }
    .dim { fill: #8b949e; }
    .out { fill: #7ee787; animation: glow 2.4s ease-in-out 3.6s infinite; }
    .cur { fill: #c9d1d9; animation: blink 1s step-end infinite; }
    @keyframes in {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes glow {
      0%, 100% { fill: #7ee787; }
      50% { fill: #c2ffd0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- window -->
  <rect x="10" y="10" width="620" height="280" rx="12" fill="#0d1117" stroke="#f74c00" stroke-opacity=".6" stroke-width="2"/>
  <line x1="10" y1="52" x2="630" y2="52" stroke="#30363d" stroke-width="1"/>
  <circle cx="36" cy="31" r="6" fill="#ff5f56"/>
  <circle cx="58" cy="31" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="31" r="6" fill="#27c93f"/>
  <text x="320" y="37" text-anchor="middle" class="dim" style="font-size:14px">main.rs</text>

  <!-- code -->
  <g class="l d1"><text x="36" y="96" xml:space="preserve"><tspan class="kw">fn</tspan> <tspan class="fn">main</tspan>() {</text></g>
  <g class="l d2"><text x="84" y="128" xml:space="preserve"><tspan class="mac">println!</tspan>(<tspan class="str">"Hello, World!"</tspan>);</text></g>
  <g class="l d3"><text x="36" y="160">}</text></g>

  <!-- terminal -->
  <g class="l d4"><text x="36" y="208" xml:space="preserve"><tspan class="dim">$</tspan> cargo run</text></g>
  <g class="l d5"><text x="36" y="244"><tspan class="out">Hello, World!</tspan></text></g>
  <g class="l d6">
    <text x="36" y="280" class="dim">$</text>
    <rect class="cur" x="56" y="264" width="11" height="20"/>
  </g>
</svg>
